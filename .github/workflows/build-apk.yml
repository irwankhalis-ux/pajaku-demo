# Membangun APK "PaJaKu" otomatis di GitHub setiap ada perubahan (atau tombol "Run workflow").
# Hasil: cabang `apk` berisi PaJaKu.apk + build.log.
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        run: |
          set -o pipefail
          { npm ci && npm run build && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon; } 2>&1 | tee build.log
      - name: Simpan APK & log ke cabang apk
        if: always()
        run: |
          mkdir apkout && cp build.log apkout/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk apkout/PaJaKu.apk 2>/dev/null || true
          cd apkout && git init -q && git checkout -q -b apk && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
