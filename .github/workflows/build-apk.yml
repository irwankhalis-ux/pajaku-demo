# Membangun dua APK otomatis di GitHub setiap ada perubahan (atau tombol "Run workflow"):
#   PaJaKu.apk  — aplikasi pedagang TokoPaja (id.patrol.pajaku)
#   Konsol-PasarJaya.apk — back office, EIS Direksi, CRM, HP L1–L5 (id.patrol.pajaku.konsol)
#   MitraPaja.apk — konsol Mitra Pengembang revitalisasi + EIS Direksi Mitra + pengawas Pasar Jaya (id.patrol.pajaku.mitra)
# Hasil: cabang `apk` berisi ketiga APK + build.log.
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Siapkan Gradle (ulang otomatis bila server unduhan sedang gangguan)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && break; echo "Unduh Gradle gagal, coba lagi ($i)"; sleep 30; done
      - name: Build
        run: |
          set -o pipefail
          mkdir -p apkout
          {
            npm ci &&
            echo "=== PaJaKu (TokoPaja) ===" &&
            NEXT_PUBLIC_APP=pedagang npm run build && npx cap sync android &&
            (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon) &&
            cp android/app/build/outputs/apk/debug/app-debug.apk apkout/PaJaKu.apk &&
            echo "=== Konsol Pasar Jaya ===" &&
            NEXT_PUBLIC_APP=konsol npm run build &&
            cp capacitor.konsol.json capacitor.config.json && npx cap sync android && git checkout capacitor.config.json &&
            (cd android-konsol && chmod +x gradlew && ./gradlew assembleDebug --no-daemon) &&
            cp android-konsol/app/build/outputs/apk/debug/app-debug.apk apkout/Konsol-PasarJaya.apk &&
            echo "=== MitraPaja ===" &&
            NEXT_PUBLIC_APP=mitra npm run build &&
            cp capacitor.mitra.json capacitor.config.json && npx cap sync android && git checkout capacitor.config.json &&
            (cd android-mitra && chmod +x gradlew && ./gradlew assembleDebug --no-daemon) &&
            cp android-mitra/app/build/outputs/apk/debug/app-debug.apk apkout/MitraPaja.apk
          } 2>&1 | tee build.log
      - name: Simpan APK & log ke cabang apk
        if: always()
        run: |
          mkdir -p apkout && cp build.log apkout/ 2>/dev/null || true
          cd apkout && git init -q && git checkout -q -b apk && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
